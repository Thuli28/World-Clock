<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="css/src.css">
    <title>World-Clock</title>
</head>
<body>
    <div class="container">
        <h1>World-Clock</h1>
        <select>
            <option value="select">Choose a City</option>
            <option value="new-york">New York</option>
            <option value="london">London</option>
            <option value="tokyo">Tokyo</option>
        </select>
        <div class="city">
            <h2 >New York 🇺🇸</h2>
            <div class="date" id="date">January 1, 2023</div>
            <div class="time" id="time">01:06:89 AM</div>
        </div>
         <div class="city">
            <h2 >London 🇬🇧</h2>
            <div class="date" id="date">January 1, 2023</div>
            <div class="time" id="time">01:06:89 AM</div>
        </div>
         <div class="city">
            <h2 >Tokyo 🇯🇵</h2>
            <div class="date" id="date">January 1, 2023</div>
            <div class="time" id="time">01:06:89 AM</div>
        </div>
    </div>
    <footer> This is coded by <a href="https://github.com/Thuli28/World-Clock.git" target="_blank">Malethola Raditsela</a></footer>
 <script src="javascript/index.js"></script>
</body>
</html>
